@import url('https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=Barlow:wght@400;500;600&display=swap');

.wrap {
  --beton: #E3E6E0;
  --beton-hell: #EEF0EB;
  --petrol: #17282C;
  --petrol-weich: #5E7075;
  --linie: #C7CCC4;
  --messing: #96681C;
  --gruen: #2E6B52;
  font-family: 'Barlow', system-ui, -apple-system, sans-serif;
  background: var(--beton);
  color: var(--petrol);
  min-height: 100%;
  padding: 0 0 88px;
  max-width: 640px;
  margin: 0 auto;
  -webkit-font-smoothing: antialiased;
}
.wrap * { box-sizing: border-box; }
.wrap h1, .wrap h2 {
  font-family: 'Barlow Condensed', 'Barlow', sans-serif;
  font-weight: 700;
  letter-spacing: -0.01em;
  margin: 0;
}
.wrap button { font-family: inherit; cursor: pointer; }
.wrap button:focus-visible, .wrap input:focus-visible, .wrap textarea:focus-visible {
  outline: 2px solid var(--messing);
  outline-offset: 2px;
}

.laden, .leer {
  padding: 48px 20px;
  color: var(--petrol-weich);
  text-align: center;
  font-size: 15px;
}

.kopf { padding: 18px 20px 10px; }
.kopf-zeile { display: flex; justify-content: space-between; align-items: baseline; }
.datum { font-size: 15px; font-weight: 500; }
.kw {
  font-family: 'Barlow Condensed', sans-serif;
  font-size: 15px;
  color: var(--petrol-weich);
}
.wochenstat {
  margin-top: 6px;
  display: flex;
  align-items: center;
  gap: 10px;
  font-size: 13px;
  color: var(--petrol-weich);
}
.trenner { width: 3px; height: 3px; background: var(--linie); border-radius: 50%; }

.nav {
  display: flex;
  gap: 0;
  border-bottom: 1px solid var(--linie);
  padding: 0 20px;
  position: sticky;
  top: 0;
  background: var(--beton);
  z-index: 5;
}
.nav button {
  background: none;
  border: none;
  border-bottom: 2px solid transparent;
  padding: 10px 16px 9px;
  font-size: 15px;
  font-weight: 500;
  color: var(--petrol-weich);
  margin-bottom: -1px;
}
.nav .nav-aktiv { color: var(--petrol); border-bottom-color: var(--messing); }

.held {
  position: relative;
  padding: 24px 20px 20px;
  overflow: hidden;
}
.held-glyph {
  position: absolute;
  right: 8px;
  top: -22px;
  font-family: 'Barlow Condensed', sans-serif;
  font-size: 150px;
  font-weight: 700;
  line-height: 1;
  color: transparent;
  -webkit-text-stroke: 2px rgba(150, 104, 28, 0.28);
  pointer-events: none;
}
.held-text { position: relative; }
.held-label {
  font-size: 13px;
  color: var(--messing);
  font-weight: 600;
  letter-spacing: 0.02em;
}
.held h1 { font-size: 30px; line-height: 1.08; margin-top: 2px; max-width: 15ch; }
.wechsel { display: flex; gap: 6px; margin-top: 14px; position: relative; }
.wechsel button {
  font-family: 'Barlow Condensed', sans-serif;
  font-size: 17px;
  font-weight: 600;
  width: 42px;
  height: 34px;
  border: 1px solid var(--linie);
  background: transparent;
  color: var(--petrol-weich);
  border-radius: 2px;
}
.wechsel .wechsel-aktiv { background: var(--petrol); color: var(--beton-hell); border-color: var(--petrol); }

.variante {
  margin: 0 20px 14px;
  padding: 12px 14px;
  background: var(--beton-hell);
  border-left: 3px solid var(--messing);
}
.variante > span { font-size: 13px; color: var(--petrol-weich); display: block; margin-bottom: 7px; }
.variante-schalter { display: flex; gap: 6px; }
.variante-schalter button {
  flex: 1;
  padding: 8px;
  font-size: 14px;
  border: 1px solid var(--linie);
  background: transparent;
  color: var(--petrol-weich);
  border-radius: 2px;
}
.variante-schalter .v-aktiv { background: var(--petrol); color: var(--beton-hell); border-color: var(--petrol); }

.block { padding: 0 20px 22px; }
.block h2 { font-size: 20px; margin-bottom: 10px; }

.warmup {
  width: 100%;
  display: flex;
  gap: 12px;
  align-items: flex-start;
  text-align: left;
  padding: 13px 14px;
  background: var(--beton-hell);
  border: 1px solid var(--linie);
  border-radius: 2px;
  color: inherit;
}
.warmup strong { display: block; font-size: 15px; font-weight: 600; }
.warmup em { display: block; font-style: normal; font-size: 13px; color: var(--petrol-weich); margin-top: 3px; line-height: 1.45; }
.haken {
  flex: 0 0 20px;
  height: 20px;
  border: 1px solid var(--petrol-weich);
  border-radius: 2px;
  display: grid;
  place-items: center;
  font-size: 13px;
  margin-top: 1px;
}
.warmup-fertig { border-color: var(--gruen); }
.warmup-fertig .haken { background: var(--gruen); border-color: var(--gruen); color: #fff; }

.liste { padding: 0 0 22px; }
.uebung { border-top: 1px solid var(--linie); }
.uebung:last-child { border-bottom: 1px solid var(--linie); }
.uebung-offen { background: var(--beton-hell); }
.uebung-kopf {
  width: 100%;
  display: flex;
  gap: 12px;
  align-items: flex-start;
  text-align: left;
  background: none;
  border: none;
  padding: 13px 20px;
  color: inherit;
}
.pos {
  font-family: 'Barlow Condensed', sans-serif;
  font-size: 15px;
  font-weight: 600;
  color: var(--messing);
  flex: 0 0 22px;
  padding-top: 1px;
}
.uebung-mitte { flex: 1; min-width: 0; }
.uebung-mitte strong { display: block; font-size: 15.5px; font-weight: 600; line-height: 1.25; }
.uebung-mitte em { display: block; font-style: normal; font-size: 13px; color: var(--petrol-weich); margin-top: 2px; }
.letzt {
  display: block;
  font-family: 'Barlow Condensed', sans-serif;
  font-size: 13px;
  color: var(--petrol-weich);
  margin-top: 4px;
  letter-spacing: 0.01em;
}
.vorschlag {
  display: block;
  font-family: 'Barlow Condensed', sans-serif;
  font-size: 14.5px;
  font-weight: 600;
  color: var(--messing);
  margin-top: 2px;
}
.vorschlag-warn { color: #A6472B; }
.vorschlag-grenze { color: var(--gruen); }
.zaehler {
  font-family: 'Barlow Condensed', sans-serif;
  font-size: 15px;
  color: var(--petrol-weich);
  flex: 0 0 auto;
  padding-top: 2px;
}
.zaehler-voll { color: var(--gruen); font-weight: 600; }

.super-label {
  font-family: 'Barlow Condensed', sans-serif;
  font-size: 12.5px;
  color: var(--messing);
  padding: 9px 20px 3px 22px;
  border-top: 1px solid var(--linie);
}
.uebung-super { border-top: none; border-left: 2px solid var(--messing); }
.uebung-super .uebung-kopf { padding-left: 18px; }
.uebung-super .saetze { padding-left: 18px; }
.uebung-super-ende { margin-bottom: 2px; }

.aufwaermen {
  margin: 0 0 10px;
  font-size: 13.5px;
  color: var(--petrol-weich);
  line-height: 1.45;
}
.aufwaermen span {
  display: inline-block;
  font-family: 'Barlow Condensed', sans-serif;
  font-size: 12.5px;
  color: var(--messing);
  margin-right: 7px;
}

.stepper-wert input::placeholder { color: var(--petrol-weich); opacity: 0.55; font-weight: 500; }
.satz-ok {
  flex: 0 0 34px;
  height: 34px;
  border: 1px solid var(--linie);
  background: var(--beton);
  color: var(--linie);
  font-size: 15px;
  border-radius: 2px;
  line-height: 1;
}
.satz-ok-an { background: var(--gruen); border-color: var(--gruen); color: #fff; }
.satz-fertig .stepper-wert { background: #F2F5F0; }
.band-geist { border-style: dashed; color: var(--petrol-weich); opacity: 0.7; }
.daten-feld {
  width: 100%;
  margin-top: 10px;
  border: 1px solid var(--linie);
  background: #fff;
  border-radius: 2px;
  padding: 9px 10px;
  font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
  font-size: 11.5px;
  color: var(--petrol);
  resize: vertical;
}
.daten .sekundaer { margin-top: 10px; }
.daten .sekundaer:disabled { opacity: 0.45; }
.daten-zweit { margin-top: 22px; }

.entwurf-banner {
  margin: 12px 20px 0;
  padding: 11px 13px;
  background: var(--beton-hell);
  border-left: 3px solid var(--messing);
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 10px;
  font-size: 13.5px;
}
.entwurf-banner button {
  background: none;
  border: none;
  color: var(--messing);
  font-size: 13.5px;
  font-weight: 600;
  text-decoration: underline;
  padding: 2px;
  flex: 0 0 auto;
}
.entwurf-hinweis {
  font-size: 12.5px;
  color: var(--petrol-weich);
  margin: 10px 0 0;
  line-height: 1.45;
}

.saetze { padding: 2px 20px 16px; }
.uebernahme-reihe { display: flex; gap: 6px; margin-bottom: 10px; flex-wrap: wrap; }
.uebernehmen {
  background: none;
  border: 1px dashed var(--linie);
  color: var(--petrol-weich);
  font-size: 13px;
  padding: 6px 10px;
  border-radius: 2px;
}
.uebernehmen-stark {
  border-style: solid;
  border-color: var(--messing);
  color: var(--messing);
  font-weight: 600;
}
.satz { display: flex; align-items: center; gap: 8px; margin-bottom: 8px; }
.satz-nr {
  font-family: 'Barlow Condensed', sans-serif;
  font-size: 14px;
  color: var(--petrol-weich);
  flex: 0 0 14px;
}

.stepper { display: flex; align-items: stretch; flex: 1; min-width: 0; }
.stepper button {
  width: 36px;
  border: 1px solid var(--linie);
  background: var(--beton);
  color: var(--petrol);
  font-size: 19px;
  line-height: 1;
  border-radius: 2px;
}
.stepper-wert {
  flex: 1;
  min-width: 0;
  display: flex;
  align-items: baseline;
  justify-content: center;
  gap: 3px;
  border-top: 1px solid var(--linie);
  border-bottom: 1px solid var(--linie);
  background: #fff;
  padding: 5px 2px;
}
.stepper-wert input {
  width: 100%;
  min-width: 0;
  border: none;
  background: none;
  text-align: right;
  font-family: 'Barlow Condensed', sans-serif;
  font-size: 21px;
  font-weight: 600;
  color: var(--petrol);
  padding: 0;
  font-variant-numeric: tabular-nums;
}
.stepper-wert span { font-size: 11.5px; color: var(--petrol-weich); flex: 0 0 auto; }

.bandwahl { display: flex; gap: 4px; flex: 1; }
.bandwahl button, .lauf-art button {
  flex: 1;
  padding: 7px 2px;
  font-size: 12.5px;
  border: 1px solid var(--linie);
  background: var(--beton);
  color: var(--petrol-weich);
  border-radius: 2px;
}
.bandwahl .band-aktiv, .lauf-art .band-aktiv {
  background: var(--petrol);
  color: var(--beton-hell);
  border-color: var(--petrol);
}

.notiz-feld { display: block; margin-bottom: 14px; }
.notiz-feld span { display: block; font-size: 13px; color: var(--petrol-weich); margin-bottom: 5px; }
.notiz-feld textarea {
  width: 100%;
  border: 1px solid var(--linie);
  background: #fff;
  border-radius: 2px;
  padding: 9px 10px;
  font-family: inherit;
  font-size: 14.5px;
  color: var(--petrol);
  resize: vertical;
}

.primaer, .sekundaer {
  width: 100%;
  padding: 13px;
  font-size: 15.5px;
  font-weight: 600;
  border-radius: 2px;
  border: 1px solid var(--petrol);
}
.primaer { background: var(--petrol); color: var(--beton-hell); }
.sekundaer { background: transparent; color: var(--petrol); border-color: var(--linie); margin-top: 12px; }

.lauf-block { border-top: 1px solid var(--linie); padding-top: 20px; }
.lauf-felder { display: flex; gap: 8px; margin-bottom: 10px; }
.lauf-art { display: flex; gap: 4px; }
.pace-anzeige {
  font-family: 'Barlow Condensed', sans-serif;
  font-size: 18px;
  color: var(--messing);
  margin: 10px 0 0;
}

.tab { width: 100%; border-collapse: collapse; font-size: 14.5px; }
.tab td, .tab th { padding: 8px 6px; border-bottom: 1px solid var(--linie); text-align: left; vertical-align: top; }
.tab th { font-size: 12.5px; color: var(--petrol-weich); font-weight: 500; }
.tab .tag { font-family: 'Barlow Condensed', sans-serif; font-weight: 600; width: 60px; }
.tab-lauf { font-size: 13px; }
.tab .typ-kraft td:last-child { color: var(--petrol); font-weight: 500; }
.tab .typ-frei td:last-child { color: var(--petrol-weich); }
.zahl { font-family: 'Barlow Condensed', sans-serif; font-size: 15px; font-variant-numeric: tabular-nums; }

.einfach { list-style: none; margin: 0; padding: 0; font-size: 14.5px; }
.einfach li {
  display: flex;
  justify-content: space-between;
  gap: 14px;
  padding: 8px 0;
  border-bottom: 1px solid var(--linie);
}
.ziel {
  font-style: normal;
  font-size: 12px;
  color: var(--messing);
  margin-left: 8px;
}
.fussnote { font-size: 13px; color: var(--petrol-weich); margin: 10px 0 0; line-height: 1.5; }

.verlauf-eintrag { border-bottom: 1px solid var(--linie); padding: 12px 0; }
.verlauf-kopf { display: flex; align-items: center; gap: 10px; margin-bottom: 7px; }
.verlauf-typ {
  font-family: 'Barlow Condensed', sans-serif;
